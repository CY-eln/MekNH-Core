allprojects { p ->
    if (p == rootProject) {
        def probeDir = layout.buildDirectory.dir('devtools/output-reservation')
        tasks.register('compileOutputReservationProbe', JavaCompile) {
            dependsOn tasks.named('classes')
            source = files('devtools/OutputReservationProbe.java')
            classpath = sourceSets.main.compileClasspath + sourceSets.main.output
            destinationDirectory = probeDir
            javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
            options.encoding = 'UTF-8'
        }
        tasks.register('outputReservationProbe', JavaExec) {
            dependsOn tasks.named('compileOutputReservationProbe')
            classpath = sourceSets.main.runtimeClasspath + files(probeDir)
            mainClass = 'OutputReservationProbe'
            workingDir = rootDir
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        }
    }
}
